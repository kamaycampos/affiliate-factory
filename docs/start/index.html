<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Affiliate Factory Setup</title>
<meta name="description" content="Set up your Affiliate Factory one step at a time. Tick each step, click Next.">
<style>
:root{color-scheme:light only}
*{box-sizing:border-box}
html,body{background:#fff;color:#000}
body{margin:0;font:20px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.brand{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bar{height:8px;background:#e6e6e6;border-radius:99px;margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:#000;width:0;transition:width .25s}
.count{font-size:15px;color:#444;margin-bottom:22px}
h1{font-size:32px;line-height:1.15;margin:0 0 6px}
.time{font-size:15px;color:#444;margin:0 0 18px}
p{margin:0 0 14px}
.q{font-size:22px;font-weight:700;margin:6px 0 10px}
.how{border-left:4px solid #000;padding:4px 0 4px 14px;margin:0 0 18px}
label.c{display:flex;gap:14px;align-items:flex-start;border:2px solid #000;border-radius:12px;padding:14px;margin:0 0 10px;cursor:pointer}
label.c input{flex:none;width:26px;height:26px;margin:2px 0 0;accent-color:#000}
label.c.on{background:#f1f1f1}
label.c small{display:block;font-size:16px;color:#444;margin-top:4px}
.opt,.next,.dl{display:block;width:100%;text-align:left;font:inherit;font-weight:700;border:2px solid #000;border-radius:12px;padding:16px;margin:0 0 10px;background:#fff;color:#000;cursor:pointer;text-decoration:none}
.opt:hover{background:#f1f1f1}
.next,.dl{background:#000;color:#fff;text-align:center;margin-top:18px}
.next[disabled]{background:#c9c9c9;border-color:#c9c9c9;cursor:not-allowed}
.hint{font-size:16px;color:#444;text-align:center;margin-top:8px;min-height:24px}
.back{font:inherit;font-size:17px;background:none;border:0;padding:8px 0;margin-top:18px;color:#000;text-decoration:underline;cursor:pointer}
a{color:#000}
.link{word-break:break-all;font-weight:700}
.pic{border:2px solid #000;border-radius:12px;margin:6px 0 18px;overflow:hidden}
.pic .cap{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#000;color:#fff;padding:6px 12px}
.pic .in{padding:16px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:1.5px solid #000;border-radius:8px;padding:7px 11px;white-space:nowrap}
.hl{outline:4px solid #f5b400;outline-offset:2px;font-weight:700}
.dim{color:#777;border-color:#bbb}
.box{border:1.5px solid #000;border-radius:10px;padding:12px;margin-bottom:10px;color:#444}
.arrow{font-weight:800;font-size:15px}
.tog{display:inline-block;width:46px;height:26px;border-radius:99px;background:#000;position:relative;vertical-align:middle;margin-right:10px}
.tog:after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.name{display:inline-flex;gap:8px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:#000;color:#fff;display:inline-grid;place-items:center;font-size:14px;font-weight:700}
ul.plain{margin:0 0 14px;padding-left:22px}
ul.plain li{margin:6px 0}
.done{font-size:54px;line-height:1;margin:0 0 8px}
@media (max-width:480px){body{font-size:18px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">The Affiliate Factory</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="count" id="count"></div>
  <div id="screen"></div>
  <button class="back" id="back" type="button">&larr; Back</button>
</div>

<script>
/* One step per screen. Tick each line, click Next. Questions skip what you already have.
   The words here match Part A of THE_AFFILIATE_FACTORY.md - change both together. */
var FILE_RAW = "https://raw.githubusercontent.com/kamaycampos/affiliate-factory/main/THE_AFFILIATE_FACTORY.md";
var FILE_NAME = "THE_AFFILIATE_FACTORY.md";

var PIC = {
  plan: '<div class="pic"><div class="cap">Where to look: bottom left of claude.ai</div><div class="in"><span class="name"><span class="av">C</span> Your name &middot; <span class="pill hl">Pro</span></span><div style="margin-top:10px">The small word next to your name is your plan: Free, Pro or Max.</div></div></div>',
  ext: '<div class="pic"><div class="cap">What you will see in Chrome</div><div class="in"><div class="row"><b>Claude</b><span class="pill hl">Add to Chrome</span><span class="arrow">then</span><span class="pill">Add extension</span></div></div></div>',
  toggle: '<div class="pic"><div class="cap">What you will see in Settings</div><div class="in"><span class="tog"></span><b>Allow bypass permissions mode</b></div></div>',
  code: '<div class="pic"><div class="cap">The Claude app: where everything is</div><div class="in"><div class="row" style="margin-bottom:12px"><span class="pill dim">Chat</span><span class="pill hl">Code</span><span class="arrow">&larr; click Code, at the top</span></div><div class="box">Type here&hellip; (the chat box)</div><div class="arrow" style="margin-bottom:6px">&darr; underneath the chat box, from left to right</div><div class="row"><span class="pill hl">My computer</span><span class="pill hl">My Factory</span><span class="pill hl">Opus 5.5</span><span class="pill hl">Bypass permissions</span></div></div></div>',
  start: '<div class="pic"><div class="cap">What it looks like before you press Enter</div><div class="in"><div class="box" style="color:#000"><span class="pill">THE_AFFILIATE_FACTORY.md</span><div style="margin-top:10px"><b>Set me up.</b></div></div><div class="row"><span class="pill">My computer</span><span class="pill">My Factory</span><span class="pill">Opus 5.5</span><span class="pill">Bypass permissions</span></div></div></div>'
};

var S = [
 {id:"welcome", title:"Set up your Affiliate Factory", time:"About 15 minutes here, then about 30 minutes with Claude",
  html:'<p>One step at a time. Tick each line when it is done, then click <b>Next</b>.</p><p>If you already have something, you skip that step.</p><ul class="plain"><li><b>Use your computer</b>, not your phone. Everything happens on the computer.</li><li><b>Cost:</b> Claude Pro, $20 a month. Nothing else. Every other tool used here is free.</li></ul>',
  nextLabel:"Start"},

 {id:"need", n:1, title:"What you need before you start",
  checks:["Your Kevin Trudeau affiliate link (from the affiliate portal).",
          "The email and password for your Instagram, Facebook, YouTube (your Google account) and TikTok.",
          "Your phone, close by. Some sites text you a code.",
          "About 45 minutes in total, at a time when nobody needs your computer."]},

 {id:"a1", n:2, title:"A1. Get Claude Pro", time:"3 minutes",
  q:"Do you already have Claude Pro?",
  html:'<div class="how">How to check: open <b>claude.ai</b> on your computer and log in. Look at the bottom left corner. Right next to your name, in small letters, it shows your plan.</div>'+PIC.plan,
  opts:[["Yes. It says Pro or Max","a2"],["It says Free","a1free"],["I have no Claude account yet","a1new"]]},
 {id:"a1free", n:2, title:"A1. Get Claude Pro", time:"1 minute", next:"a2",
  checks:['Click your name (bottom left), then "Upgrade plan". Choose Pro, $20 a month, and pay with your card.<small>You type your own card details. Claude never asks for them.</small>']},
 {id:"a1new", n:2, title:"A1. Get Claude Pro", time:"3 minutes", next:"a2",
  checks:["On your computer, open claude.ai",
          'Click "Sign up". Use "Continue with Google" or your email, and follow the steps.',
          'Click your name (bottom left), then "Upgrade plan". Choose Pro, $20 a month, and pay with your card.<small>You type your own card details. Claude never asks for them.</small>']},

 {id:"a2", n:3, title:"A2. Install the Claude app", time:"3 minutes",
  q:"Is the Claude app already installed on this computer?",
  html:'<div class="how">The app is a program on your computer, with its own Claude icon. It is not the claude.ai website. Having Claude Pro does not mean you have the app.</div>',
  opts:[["Yes. I can open the Claude app","a2yes"],["No, or I am not sure","a2no"]]},
 {id:"a2yes", n:3, title:"A2. Install the Claude app", next:"a3",
  checks:["Open the Claude app. Check that it is signed in with the same account as in A1 (your name shows at the bottom left)."]},
 {id:"a2no", n:3, title:"A2. Install the Claude app", time:"3 minutes", next:"a3",
  checks:['Open <a href="https://claude.ai/download" target="_blank" rel="noopener">claude.ai/download</a> and click the button for your computer (Mac or Windows).',
          'Mac: open the downloaded file, drag Claude into Applications, then open Claude from Applications. If the Mac asks "Are you sure you want to open it?", click Open.<small>Windows: open the downloaded file and follow the installer.</small>',
          "Sign in with the same account as in A1."]},

 {id:"a3", n:4, title:"A3. Google Chrome and the Claude extension", time:"3 minutes",
  q:"Do you already have Google Chrome with the Claude extension in it?",
  html:'<div class="how">Your Claude works in Chrome, where your accounts are already logged in. The extension shows as a Claude icon at the top right of Chrome (it can hide behind the puzzle piece).</div>',
  opts:[["Yes. Chrome and the Claude extension","a3yes"],["I have Chrome, but not the extension","a3ext"],["I do not have Chrome","a3chrome"]]},
 {id:"a3yes", n:4, title:"A3. Google Chrome and the Claude extension", next:"a4",
  checks:["Click the Claude icon in Chrome. Check that it is signed in with the same Claude account as in A1."]},
 {id:"a3chrome", n:4, title:"A3. Google Chrome and the Claude extension", time:"2 minutes", next:"a3ext",
  checks:['Install Google Chrome from <a href="https://www.google.com/chrome/" target="_blank" rel="noopener">google.com/chrome</a>, then open this page again in Chrome.']},
 {id:"a3ext", n:4, title:"A3. Google Chrome and the Claude extension", time:"3 minutes", next:"a4",
  html:PIC.ext,
  checks:['In Chrome, open the <a href="https://chromewebstore.google.com/detail/claude/fcoeoabgfenejglbffodgkkbkcdhcgfn" target="_blank" rel="noopener">Claude extension page</a>.',
          'Click "Add to Chrome", then "Add extension".',
          "Click the puzzle piece (top right of Chrome), then click the pin next to Claude, so its icon stays visible.",
          "Click the Claude icon and sign in with the same Claude account as in A1."]},

 {id:"a4", n:5, title:"A4. Let your Claude work without stopping to ask", time:"1 minute",
  html:PIC.toggle,
  checks:["In the Claude app, click your name (bottom left), then Settings, then Code.",
          'Turn ON: "Allow bypass permissions mode".<small>This lets your Claude do the setup without asking "may I?" a hundred times. After setup, you can switch the mode back to Auto.</small>']},

 {id:"a5", n:6, title:"A5. Make a folder and download your setup file", time:"1 minute",
  checks:['On your Desktop, right-click. Mac: choose "New Folder". Windows: choose "New", then "Folder". Name it <b>My Factory</b>.',
          'Download the setup file with the button below.<small>Already got the file from Kamay? Use that one and tick this line.</small>',
          "Drag the file (THE_AFFILIATE_FACTORY) from your Downloads into the My Factory folder."],
  extra:'<a class="dl" id="dl" href="'+FILE_RAW+'" target="_blank" rel="noopener">Download the setup file</a><div class="hint" id="dlhint"></div>'},

 {id:"a6", n:7, title:"A6. Open Claude Code, the right way", time:"2 minutes",
  html:PIC.code,
  checks:["In the Claude app, click the Code tab at the top. It must be Code, not Chat.",
          'Underneath the chat box at the bottom, make sure the settings say this, from left to right:<small><b>My computer</b><br><b>Folder: My Factory</b> (from step A5)<br><b>Opus 5.5</b><br><b>Mode: Bypass permissions</b></small>',
          "Leave everything else as it is."]},

 {id:"a7", n:8, title:"A7. Keep your computer awake", time:"10 seconds",
  checks:["Plug the computer in, and do not close the lid during setup. Some steps run for a few minutes."]},

 {id:"a8", n:9, title:"A8. Start", time:"10 seconds",
  html:PIC.start,
  checks:["Drag the setup file from the My Factory folder into the chat box.",
          "Type: <b>Set me up.</b>",
          "Press Enter."], nextLabel:"I pressed Enter"},

 {id:"done", n:10, title:"Your part is done. Claude leads now.",
  html:'<div class="done">&#10003;</div><p>Go back to the Claude app and follow what Claude says. For about 30 minutes you only do four kinds of things:</p><ul class="plain"><li><b>Log in</b> where Claude asks. You type your own passwords; Claude never sees them.</li><li>Click <b>Allow</b>, <b>Continue</b> or <b>Agree</b> when Claude tells you to.</li><li><b>Choose</b> how your clips look and sound, and what they are about.</li><li><b>Paste a key</b> when Claude asks.</li></ul><p><b>If something gets in the way</b></p><ul class="plain"><li><b>Stuck on a step?</b> Click the "I\'m stuck" button under Claude\'s message, or type what you see in plain words. Claude will find another way.</li><li><b>"Usage limit reached":</b> wait until the time Claude shows, then type: continue. Everything done so far is saved.</li><li><b>A web page stops reacting:</b> bring the Chrome window Claude is working in to the front and leave it there.</li><li><b>A site asks for a code:</b> type it yourself from your phone or email. Never read it out to Claude.</li></ul><p><a href="cards.html">See what Claude does next, in pictures</a></p>',
  last:true}
];

var TOTAL = 10, KEY = "af_setup_v2";
var st = {at:"welcome", hist:[], ticks:{}};
try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && saved.at) st = saved; } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function find(id){ for (var i = 0; i < S.length; i++) if (S[i].id === id) return i; return -1; }
var h = (location.hash || "").slice(1).toLowerCase();
if (h && find(h) >= 0 && h !== st.at) { st.hist.push(st.at); st.at = h; }

function go(id){ st.hist.push(st.at); st.at = id; save(); render(); }
function nextOf(s){ return s.next || S[find(s.id) + 1].id; }

function render(){
  var i = find(st.at); if (i < 0) { st.at = "welcome"; i = 0; }
  var s = S[i], n = s.n || 0, el = document.getElementById("screen"), out = "";
  document.getElementById("bar").style.width = Math.round(n / TOTAL * 100) + "%";
  document.getElementById("count").textContent = n ? (s.last ? "All steps done" : "Step " + n + " of " + (TOTAL - 1)) : "";
  document.getElementById("back").style.display = st.hist.length ? "" : "none";
  out += "<h1>" + s.title + "</h1>";
  if (s.time) out += '<p class="time">' + s.time + "</p>";
  if (s.q) out += '<p class="q">' + s.q + "</p>";
  if (s.html) out += s.html;
  if (s.opts) for (var o = 0; o < s.opts.length; o++) out += '<button type="button" class="opt" data-go="' + s.opts[o][1] + '">' + s.opts[o][0] + "</button>";
  var t = st.ticks[s.id] || [];
  if (s.checks) for (var c = 0; c < s.checks.length; c++)
    out += '<label class="c' + (t[c] ? " on" : "") + '"><input type="checkbox" data-c="' + c + '"' + (t[c] ? " checked" : "") + "><span>" + s.checks[c] + "</span></label>";
  if (s.extra) out += s.extra;
  if (!s.opts && !s.last) out += '<button type="button" class="next" id="next">' + (s.nextLabel || "Next") + '</button><div class="hint" id="hint"></div>';
  el.innerHTML = out;
  var boxes = el.querySelectorAll("input[data-c]");
  function ready(){
    var b = document.getElementById("next"); if (!b) return;
    var all = true; for (var k = 0; k < boxes.length; k++) if (!boxes[k].checked) all = false;
    b.disabled = !all;
    document.getElementById("hint").textContent = all ? "" : (boxes.length > 1 ? "Tick every line to continue." : "Tick the line to continue.");
  }
  for (var k = 0; k < boxes.length; k++) boxes[k].addEventListener("change", function(){
    var arr = st.ticks[s.id] || []; arr[+this.getAttribute("data-c")] = this.checked; st.ticks[s.id] = arr; save();
    this.parentNode.className = "c" + (this.checked ? " on" : ""); ready();
  });
  ready();
  var os = el.querySelectorAll("[data-go]");
  for (var m = 0; m < os.length; m++) os[m].addEventListener("click", function(){ go(this.getAttribute("data-go")); });
  var nb = document.getElementById("next"); if (nb) nb.addEventListener("click", function(){ go(nextOf(s)); });
  var dl = document.getElementById("dl"); if (dl) dl.addEventListener("click", download);
  try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
  window.scrollTo(0, 0);
}

/* The file is read from the kit itself, so the download is always the newest version. */
function download(ev){
  if (!window.fetch || !window.Blob) return;
  ev.preventDefault();
  var hint = document.getElementById("dlhint"); hint.textContent = "Downloading...";
  fetch(FILE_RAW, {cache:"no-store"}).then(function(r){ if (!r.ok) throw 0; return r.blob(); }).then(function(b){
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([b], {type:"application/octet-stream"}));
    a.download = FILE_NAME; document.body.appendChild(a); a.click(); a.remove();
    hint.textContent = "Downloaded. Look in your Downloads folder for THE_AFFILIATE_FACTORY.";
  }).catch(function(){ hint.textContent = ""; window.open(FILE_RAW, "_blank"); });
}

document.getElementById("back").addEventListener("click", function(){ if (st.hist.length) { st.at = st.hist.pop(); save(); render(); } });
render();
</script>
</body>
</html>
